name: Daily Update Plugin Versions

# Run daily at 00:00 UTC
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugin-versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pipx install .[dev]

      - name: Update plugin versions, if possible
        run: |
          VENV_PYTHON=$(pipx environment --value PIPX_HOME)/venvs/gurk/bin/python
          $VENV_PYTHON .github/scripts/gurk_update_plugins.py

      - name: Commit changes (if any)
        id: commit
        run: |
            # Commit any changes made by the update (if any)
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Automated update of plugin versions" || echo "No commit created"
              echo "UPDATED=true" >> $GITHUB_ENV
            else
              echo "No changes to commit"
              echo "UPDATED=false" >> $GITHUB_ENV
            fi

      - name: Create pull request
        if: steps.commit.outputs.UPDATED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.COMMIT_TOKEN }}
          commit-message: "Automated update of plugin versions"
          committer: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: automated/daily-check-${{ github.run_id }}
          delete-branch: true
          title: "Automated update of plugin versions"
          body: |
            This PR was automatically generated by a daily GitHub Actions workflow.
            It contains changes produced by `.github/scripts/gurk_update_plugins.py`.
          labels: automated
          assignees: ArturoRoberti
          reviewers: ArturoRoberti
