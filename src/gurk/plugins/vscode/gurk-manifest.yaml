# No plugin imports

tasks:
  vscode/install-vscode:
    description: Install Visual Studio Code
    script: scripts/installations.bash
    function: install_vscode
  vscode/install-vscode-extensions:
    description: Install a list of Visual Studio Code extensions
    script: scripts/installations.py
    function: install_vscode_extensions
    config_file: config/install_vscode_extensions.txt
    depends_on: [vscode/install-vscode]
# TODO: Remove this task, and use 'gurk/configure-filestructure' in a run option instead.
#       Similarly, configure vscode settings and snippets in run options.
  vscode/configure-vscode-keybindings:
    description: Configure Visual Studio Code keybindings
    script: scripts/configurations.py
    function: configure_vscode_keybindings
    config_file: config/configure_vscode_keybindings.jsonc
    depends_on: [vscode/install-vscode]

options:
  default:
    vscode/install-vscode-extensions: {}
    vscode/configure-vscode-keybindings: {}
