# No plugin imports

define:
  name: "docker"
  description: "Plugin to install anything related to Docker."
  tasks:
    install-docker:
      description: Install Docker and related tools
      script: scripts/docker.bash
      function: null
      args:
        allowed: [nvidia-container-toolkit, devcontainers-cli, distrobox]
        default: [nvidia-container-toolkit, devcontainers-cli, distrobox]
    install-docker-images:
      description: Pull a list of Docker images
      script: scripts/docker_images.py
      function: install_docker_images
      config_file: config/install_docker_images.jsonc
      depends_on: [install-docker]

run:
  default:
    enable_dependencies: true
    install-docker-images:
      enabled: true
