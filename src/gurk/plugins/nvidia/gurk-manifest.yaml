imports: [conda]

tasks:
  nvidia/install-cuda:  # TODO: Allow version specification, and then adapt driver version to that (default: "latest" as is right now)
    description: Install NVIDIA CUDA Toolkit (and compatible driver). WARNING -
      Removes driver prime-selection!
    script: scripts/nvidia.bash
    function: install_cuda
    supercedes: [nvidia/install-nvidia-driver]
  nvidia/install-isaaclab:
    description: Install NVIDIA IsaacLab
    script: scripts/isaac.bash
    function: install_isaaclab
    depends_on: [nvidia/install-isaacsim, conda/install-conda]
    args:
      --nvidia-isaaclab-version:
        help: Specify the IsaacLab version to install
        choices: [recommended, latest, v2.*]
        default: recommended
  nvidia/install-isaacsim:
    description: Install NVIDIA IsaacSim
    script: scripts/isaac.bash
    function: install_isaacsim
    args:
      --nvidia-isaacsim-version:
        help: Specify the IsaacSim version to install
        choices: [latest, 4.*, 5.*]
        default: latest
  nvidia/install-nvidia-driver:
    description: Install NVIDIA driver (standalone). WARNING - Removes CUDA
      compatibility!
    script: scripts/nvidia.bash
    function: install_nvidia_driver
    args:
      --nvidia-driver-version:
        help: Specify the NVIDIA driver version to install
        choices: [recommended, latest, nvidia-driver-*]
        default: recommended
      --nvidia-include-server-drivers:
        default: false
        help: Include server drivers in the installation options
      --nvidia-include-open-drivers:
        default: false
        help: Include open-source drivers in the installation options
      --nvidia-prime-select:
        default: true
        help: Enable GPU prime-select after installation (if applicable)

options:
  default:
    nvidia/install-cuda:
      enabled: true
    nvidia/install-nvidia-driver:
      enabled: false
    nvidia/install-isaaclab:
      enabled: true
