# No plugin imports

define:
  name: "pip"
  description: "Plugin to install pip virtual environments and pipx CLI packages."
  tasks:
    install-pip-environments:
      description: Install Python pip virtual environments
      script: scripts/installations.py
      function: install_pip_environments
      config_file: config/install_pip_environments.jsonc
    install-pipx-packages:
      description: Install a list of pipx CLI packages
      script: scripts/installations.py
      function: install_pipx_packages
      config_file: config/install_pipx_packages.txt

run:
  default:
    install-pip-environments:
      enabled: true
    install-pipx-packages:
      enabled: true
