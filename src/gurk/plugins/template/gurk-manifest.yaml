# (Optional) Define external plugins to import first. Same functionality as `gurk pull`
imports: [gurk]

# (Optional) Define new tasks here, with at least mandatory fields ('description', 'script' and 'function')
tasks:
  template/install-some-task:
    description: "A sample task"
    script: scripts/some_script.bash
    function: some_function
  template/configure-another-task:
    description: "Another sample task"
    script: scripts/another_script.py
    function: null
    depends_on: [gurk/install-apt-packages]
    config_file: config/another_task_config.txt

# Define how to run this plugin
# - This can either use existing tasks (in other plugins) or use your defined tasks.
# - The 'default' option will be used when running `gurk run <plugin>` without specifying an option.
# - Other options can be used by running `gurk run <plugin>:<option-name>`
# - Dependencies of enabled tasks will also be enabled.
options:
  some-option: &some_option
    template/install-some-task: {}
  another-option:
    template/configure-another-task: {}
  default: *some_option
