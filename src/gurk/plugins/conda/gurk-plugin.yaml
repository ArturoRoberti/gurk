# No plugin imports

define:
  name: "conda"
  description: "Plugin to install Conda (Miniconda/Anaconda) and manage Conda/Mamba environments."
  tasks:
    conda/install-conda:
      description: Install Conda (Miniconda/Anaconda)
      script: scripts/conda.bash
      function: install_conda
      config_file: config/install_conda_environments.jsonc
      args:
        --conda-conda-distribution:
          help: Specify the Conda distribution to install
          choices: [miniconda, anaconda]
          default: miniconda
    conda/install-conda-environments:
      description: Install Conda/Mamba environments
      script: scripts/conda_environments.py
      function: install_conda_environments
      config_file: config/install_conda_environments.jsonc
      args:
        --conda-update-environments:
          default: False
          help: Update existing environments if they already exist. Otherwise, skip them.
    conda/install-mamba:
      description: Install (Micro)Mamba
      script: scripts/conda.bash
      function: install_mamba
      depends_on: [conda/install-conda]  # NOTE: "mamba" requires conda, "micromamba" does not (is standalone)
      args:
        --conda-mamba-distribution:
          help: Specify the Mamba distribution to install
          choices: [micromamba, mamba]
          default: micromamba

run:
  options:
    conda:
      conda/install-conda:
        enabled: true
      conda/install-conda-environments:
        enabled: true
    mamba: &mamba_option
      conda/install-mamba:
        enabled: true
      conda/install-conda-environments:
        enabled: true
  default: *mamba_option
